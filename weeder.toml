type-class-roots = true

roots = [
  "^Main\\.main$",
  "^PscIdeSpec\\.main$",

  # These declarations are believed to be used in other projects that we want
  # to continue to support.
  "^Language\\.PureScript\\.CoreFn\\.FromJSON\\.moduleFromJSON$",
  # moduleToJSON is the producer counterpart of moduleFromJSON above (same
  # CoreFn-JSON interop contract with external tooling); it's exercised by
  # TestCoreFn.hs's round-trip test but has no internal caller since purs
  # compile no longer exposes a --dump-corefn-style flag.
  "^Language\\.PureScript\\.CoreFn\\.ToJSON\\.moduleToJSON$",
  "^Language\\.PureScript\\.CST\\.Print\\.printModule$",
  # Curated public exports of the CST toolkit facade (Language.PureScript.CST
  # re-exports the whole parser/lexer surface for external tools), unused
  # internally but kept for the same reason as printModule/parseExpr below.
  "^Language\\.PureScript\\.CST\\.pureResult$",
  "^Language\\.PureScript\\.CST\\.Lexer\\.lexTopLevel$",

  # These declarations are there to be used during development or testing.
  "^Language\\.PureScript\\.Ide\\.Imports\\.parseImport$",
  "^Language\\.PureScript\\.TypeChecker\\.Monad\\.debug",

  # These declarations are used by Template Haskell code.
  "^Language\\.PureScript\\.Constants\\.TH\\.",

  # These declarations are produced by Template Haskell when generating
  # pattern synonyms; this confuses Weeder.
  "^Language\\.PureScript\\.Constants\\..*\\.\\$[bm]",

  # These declarations are unprincipled exceptions that we don't mind
  # supporting just in case they're used now or in the future.
  "^Language\\.PureScript\\.CST\\.Parser\\.parseExpr$",
  # Additional %name/%partial entry points generated from Parser.y, exported
  # from the module for the same reason as parseExpr above.
  "^Language\\.PureScript\\.CST\\.Parser\\.parseIdent$",
  "^Language\\.PureScript\\.CST\\.Parser\\.parseOperator$",
  "^Language\\.PureScript\\.CST\\.Parser\\.parseDeclP$",
  "^Language\\.PureScript\\.CST\\.Parser\\.parseExprP$",
  "^Language\\.PureScript\\.CST\\.Parser\\.parseTypeP$",
  "^Language\\.PureScript\\.CST\\.Parser\\.parseModuleNameP$",
  "^Language\\.PureScript\\.CST\\.Parser\\.parseQualIdentP$",

  # These declarations are generated by tools; it doesn't matter if they're
  # unused because we can't do anything about them.
  "^Language\\.PureScript\\.CST\\.Parser\\.happy",
  "^Paths_purescript?\\.",

  # These declarations are part of the Erlang codegen optimizer passes that
  # are deliberately not wired into Optimizer.optimize's pipeline. This was a
  # compile-time-vs-codegen-quality tradeoff ("Rework optimization pipeline
  # for compilation speed"); reviving them (in particular MagicDo) is tracked
  # as separate, deferred future work rather than something to delete.
  "^Language\\.PureScript\\.Erl\\.CodeGen\\.Optimizer\\.MagicDo\\.",
  "^Language\\.PureScript\\.Erl\\.CodeGen\\.Optimizer\\.Memoize\\.",
  "^Language\\.PureScript\\.Erl\\.CodeGen\\.Optimizer\\.Unused\\.",
  # untilFixedPoint and buildExpander only exist to support re-wiring tidyUp
  # and magicDo back into the pipeline (see the commented-out call in
  # Optimizer.hs); they're unused for the same reason as the pass above.
  "^Language\\.PureScript\\.Erl\\.CodeGen\\.Optimizer\\.untilFixedPoint$",
  "^Language\\.PureScript\\.Erl\\.CodeGen\\.Optimizer\\.buildExpander$",
  # Only referenced from MagicDo, which is itself unreachable per the above.
  "^Language\\.PureScript\\.Erl\\.CodeGen\\.Constants\\.controlApplicative$",
]
